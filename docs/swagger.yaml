basePath: /
definitions:
  bot_tgWorker.JSONResponse:
    properties:
      error:
        type: boolean
      message:
        type: string
    type: object
  bot_tgWorker.LinkRequest:
    properties:
      user_id:
        type: integer
    type: object
  bot_tgWorker.LinkResponse:
    properties:
      link_url:
        type: string
    type: object
  bot_tgWorker.TGChat:
    properties:
      id:
        type: integer
      type:
        type: string
    type: object
  bot_tgWorker.TGMessage:
    properties:
      chat:
        $ref: '#/definitions/bot_tgWorker.TGChat'
      message_id:
        type: integer
      text:
        type: string
    type: object
  bot_tgWorker.UpdatesRequest:
    properties:
      message:
        $ref: '#/definitions/bot_tgWorker.TGMessage'
      update_id:
        type: integer
    type: object
  order_orderReceiver.JSONResponse:
    properties:
      error:
        type: boolean
      message:
        type: string
    type: object
  order_orderReceiver.Order:
    properties:
      contactPhone:
        type: string
      createdAt:
        type: string
      id:
        type: integer
      notes:
        type: string
      orderItems:
        items:
          $ref: '#/definitions/order_orderReceiver.OrderItem'
        type: array
      orderStatus:
        $ref: '#/definitions/order_orderReceiver.OrderStatus'
      updatedAt:
        type: string
      userId:
        type: integer
    type: object
  order_orderReceiver.OrderItem:
    properties:
      id:
        type: integer
      productId:
        type: integer
      quantity:
        type: integer
    type: object
  order_orderReceiver.OrderStatus:
    enum:
    - 0
    - 1
    - 2
    - 3
    - 4
    type: integer
    x-enum-varnames:
    - Created
    - Paid
    - Shipped
    - Delivered
    - Canceled
info:
  contact: {}
  description: Internal APIs for order-service and telegram binding
  title: Stroy1Click Bot API
  version: "1.0"
paths:
  /api/v1/telegram/link:
    post:
      consumes:
      - application/json
      description: Generates one-time token and returns t.me link with /start <token>.
      parameters:
      - description: User id to link
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/bot_tgWorker.LinkRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/bot_tgWorker.LinkResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/bot_tgWorker.JSONResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/bot_tgWorker.JSONResponse'
      summary: Create Telegram deep-link for binding
      tags:
      - telegram
  /api/v1/telegram/send:
    post:
      consumes:
      - application/json
      description: Finds chat_id by userId and sends formatted order message to user.
      parameters:
      - description: Order DTO
        in: body
        name: order
        required: true
        schema:
          $ref: '#/definitions/order_orderReceiver.Order'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/order_orderReceiver.JSONResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/order_orderReceiver.JSONResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/order_orderReceiver.JSONResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/order_orderReceiver.JSONResponse'
      summary: Send order notification to Telegram user
      tags:
      - order
  /api/v1/telegram/updates:
    post:
      consumes:
      - application/json
      description: Receives updates from Telegram and binds userId to chatId.
      parameters:
      - description: Secret token
        in: header
        name: X-Telegram-Bot-Api-Secret-Token
        required: true
        type: string
      - description: Telegram update payload (subset)
        in: body
        name: update
        required: true
        schema:
          $ref: '#/definitions/bot_tgWorker.UpdatesRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/bot_tgWorker.JSONResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/bot_tgWorker.JSONResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/bot_tgWorker.JSONResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/bot_tgWorker.JSONResponse'
      summary: Telegram webhook endpoint
      tags:
      - telegram
schemes:
- http
- https
swagger: "2.0"
